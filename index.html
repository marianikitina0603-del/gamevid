<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080f25">
<title>Математическая лаборатория — интерактивная викторина</title>
<style>
:root{color-scheme:dark;--cyan:#70eafa;--violet:#ab8cff;--ink:#071021;--white:#f3f8ff;--edge:rgba(173,226,255,.24)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:#080f25;color:var(--white);overflow:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 70% 40%,#233a68 0%,#0c1531 52%,#070b18 100%);isolation:isolate}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;pointer-events:none}
#videoWelcome{z-index:0}#videoSuccess,#videoOops{z-index:1;visibility:hidden;opacity:0;transition:opacity .12s ease}
#videoSuccess.active,#videoOops.active{visibility:visible;opacity:1}
.scene::after{content:"";pointer-events:none;position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(4,9,25,.59),rgba(4,9,25,.12) 54%,rgba(4,9,25,.03) 80%),linear-gradient(0deg,rgba(4,9,25,.41),transparent 40%);opacity:.85}
.hud{position:relative;z-index:4;min-height:100dvh;pointer-events:none}
.header{position:absolute;top:max(18px,env(safe-area-inset-top));left:clamp(18px,3.5vw,60px);right:clamp(18px,3.5vw,60px);display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-symbol{height:40px;width:40px;border:1px solid var(--edge);border-radius:14px;display:grid;place-items:center;background:rgba(83,154,229,.13);box-shadow:0 0 28px #66d8ff28;font-size:24px}.brand small{display:block;color:#b4ceef;text-transform:uppercase;letter-spacing:.19em;font-size:10px;font-weight:700}.brand h1{font-weight:750;font-size:clamp(16px,1.65vw,24px);line-height:1.15;margin:3px 0 0;text-shadow:0 2px 20px #050b20}
.header-right{display:flex;gap:12px;align-items:center;pointer-events:auto}
.stars{display:flex;gap:5px;align-items:center;padding:9px 14px;border:1px solid var(--edge);border-radius:15px;background:rgba(10,22,49,.54);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.star{font-size:23px;line-height:1;color:rgba(196,211,243,.38);filter:grayscale(1);transition:transform .35s,color .35s,text-shadow .35s}.star.earned{filter:none;color:#ffd96d;text-shadow:0 0 16px rgba(255,212,66,.8);transform:scale(1.13)}
.restart{border-radius:14px;border:1px solid var(--edge);background:rgba(13,29,58,.6);color:#ecf8ff;padding:12px 17px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-weight:700}.restart:hover{background:rgba(52,85,145,.68)}
.question-panel{position:absolute;bottom:clamp(18px,4vh,50px);left:clamp(18px,3.5vw,60px);width:clamp(350px,36vw,590px);max-height:calc(100dvh - 128px);overflow-y:auto;padding:clamp(21px,2.15vw,32px);border:1px solid rgba(156,223,255,.28);border-radius:25px;background:linear-gradient(135deg,rgba(11,27,55,.76),rgba(25,23,64,.63));box-shadow:0 22px 70px rgba(1,4,20,.45),inset 0 1px rgba(255,255,255,.13);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);pointer-events:auto}
.question-panel[hidden],.victory[hidden]{display:none!important}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.level-tag{border-radius:999px;padding:7px 11px;background:rgba(89,215,247,.10);border:1px solid rgba(100,218,245,.23)}
.progress{display:flex;gap:7px;margin:15px 0 24px}.progress span{height:4px;background:rgba(180,220,255,.21);border-radius:9px;flex:1}.progress span.done{background:linear-gradient(90deg,#57e1f7,#9f80ff);box-shadow:0 0 11px #76b8ff64}
.question-panel h2{font-size:clamp(22px,2.05vw,31px);font-weight:750;line-height:1.34;margin:0 0 20px;text-wrap:balance}
.answer-list{display:grid;gap:11px}
.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;min-height:57px;padding:12px 15px;border-radius:15px;color:#f7fbff;border:1px solid rgba(180,226,255,.24);background:rgba(111,161,241,.10);transition:background .16s,border .16s,transform .16s}
.answer:hover:not(:disabled){background:rgba(101,168,244,.23);border-color:rgba(140,228,252,.7);transform:translateX(3px)}
.answer:disabled{cursor:default}.letter{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:rgba(174,218,255,.13);display:grid;place-items:center;color:#addef7;font-weight:800;font-size:13px}
.answer.correct{border-color:#82f5ab;background:rgba(35,165,85,.40);box-shadow:0 0 20px rgba(43,232,116,.20)}
.answer.wrong{border-color:#ff8b9b;background:rgba(194,53,85,.38);box-shadow:0 0 20px rgba(239,77,102,.18)}
.answer.correct .letter{background:#1a9d63;color:#fff}.answer.wrong .letter{background:#b7355d;color:#fff}
.feedback{min-height:26px;margin:17px 0 0;font-weight:750;color:#a5f6c0}.feedback.error{color:#ffb0c0}.feedback:empty{margin-top:8px;min-height:0}
.victory{position:absolute;left:clamp(18px,3.5vw,60px);bottom:clamp(18px,4vh,50px);width:min(520px,calc(100vw - 36px));padding:clamp(26px,3vw,45px);border:1px solid #b9eaff75;border-radius:27px;background:linear-gradient(145deg,rgba(10,31,65,.85),rgba(44,25,87,.78));backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);box-shadow:0 25px 85px #050a25aa;pointer-events:auto;text-align:center}
.victory .bigstars{font-size:clamp(30px,4vw,48px);letter-spacing:4px;color:#ffdc78;text-shadow:0 0 20px #fdbb5799;animation:appear .5s ease both}
.victory h2{font-size:clamp(28px,3.2vw,44px);margin:15px 0 10px}.victory p{color:#dbe7ff;font-size:18px;line-height:1.5}.again{margin-top:14px;padding:15px 24px;background:linear-gradient(95deg,#65d7f7,#a68eff);color:#07142c;border:0;border-radius:15px;font-weight:850;box-shadow:0 7px 27px #7b9cff55}.again:hover{filter:brightness(1.12)}
.orbit{position:absolute;z-index:3;right:9%;bottom:13%;width:130px;aspect-ratio:1;border-radius:50%;border:1px solid rgba(128,231,255,.18);box-shadow:0 0 55px #68cfff19;pointer-events:none;opacity:.5;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-18px)}}@keyframes appear{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@media(max-width:800px){.header{gap:10px}.brand-symbol{height:35px;width:35px}.brand small{font-size:9px}.header-right{gap:7px}.stars{padding:7px 9px}.star{font-size:19px}.restart{padding:10px 12px;font-size:12px}.question-panel{width:min(460px,calc(100vw - 36px));max-height:calc(100dvh - 110px);padding:20px}.question-panel h2{font-size:22px}.orbit{display:none}}
@media(max-width:520px){.header{left:12px;right:12px;top:max(9px,env(safe-area-inset-top));align-items:flex-start}.brand{gap:7px}.brand-symbol{height:32px;width:32px;border-radius:9px;font-size:19px}.brand h1{font-size:14px}.brand small{letter-spacing:.07em;font-size:8px}.header-right{gap:5px}.stars{gap:1px;padding:6px}.star{font-size:16px}.restart{border-radius:10px;padding:9px 8px;font-size:11px}.question-panel{left:10px;bottom:max(10px,env(safe-area-inset-bottom));width:calc(100vw - 20px);max-height:min(68dvh,620px);padding:16px;border-radius:19px}.question-panel h2{font-size:20px;margin-bottom:14px}.progress{margin:12px 0 16px}.answer-list{gap:7px}.answer{min-height:49px;padding:9px 11px;font-size:15px}.feedback{margin-top:11px;font-size:14px}.victory{left:10px;bottom:10px;width:calc(100vw - 20px)}.scene video{object-position:65% center}}
@media(max-height:560px) and (min-width:600px){.header{top:8px}.question-panel{bottom:8px;max-height:calc(100dvh - 73px);padding:15px 19px}.progress{margin:8px 0 12px}.question-panel h2{font-size:19px;margin-bottom:12px}.answer-list{gap:6px}.answer{min-height:42px;padding:7px 12px}.feedback{margin-top:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <video id="videoWelcome" src="./privet.mp4" autoplay muted loop playsinline preload="auto"></video>
  <video id="videoSuccess" src="./ura.mp4" muted playsinline preload="auto"></video>
  <video id="videoOops" src="./oops.mp4" muted playsinline preload="auto"></video>
  <div class="orbit"></div>
</div>
<main class="hud">
  <header class="header">
    <div class="brand"><span class="brand-symbol" aria-hidden="true">⚛</span><div><small>Тренажёр исследователя</small><h1>Математическая лаборатория</h1></div></div>
    <div class="header-right"><div class="stars" id="stars" aria-label="Собрано звёзд: 0 из 5"><span class="star" aria-hidden="true">★</span><span class="star" aria-hidden="true">★</span><span class="star" aria-hidden="true">★</span><span class="star" aria-hidden="true">★</span><span class="star" aria-hidden="true">★</span></div><button type="button" class="restart" id="restart">↻ Начать заново</button></div>
  </header>
  <section class="question-panel" id="questionPanel" aria-label="Игровой вопрос">
    <div class="panel-top"><span>Миссия · Вычисления</span><span class="level-tag" id="questionNumber">01 / 05</span></div>
    <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <h2 id="questionText"></h2>
    <div class="answer-list" id="answers"></div>
    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  </section>
  <section class="victory" id="victory" hidden aria-label="Победа">
    <div class="bigstars" aria-hidden="true">★★★★★</div>
    <h2>ПОЗДРАВЛЯЕМ!</h2>
    <p>Ты прошел все испытания и собрал пять звёзд!</p>
    <button type="button" class="again" id="again">Играть снова ✨</button>
  </section>
</main>
<script>
"use strict";
// Каждая миссия содержит все пять вопросов в случайном порядке.
const questions = [
  {question:"Вычислите: 3,4 + 2,75",answers:["5,15","6,15","6,05"],correctIndex:1},
  {question:"Вычислите: 10 − 4,3",answers:["6,3","6,7","5,7"],correctIndex:2},
  {question:"Вычислите: 2,5 · 0,4",answers:["1","10","0,1"],correctIndex:0},
  {question:"Вычислите: 7,2 : 0,8",answers:["0,9","9","90"],correctIndex:1},
  {question:"Масса первого арбуза 4,5 кг, а второго — на 1,25 кг меньше. Какова общая масса двух арбузов?",answers:["5,75 кг","7,75 кг","8,25 кг"],correctIndex:1}
];
const TARGET_STARS = 5;
const MAX_REACTION_MS = 20000; // Только аварийная страховка; обычное завершение — по ended.
const videoWelcome = document.getElementById("videoWelcome");
const videoSuccess = document.getElementById("videoSuccess");
const videoOops = document.getElementById("videoOops");
const answersNode = document.getElementById("answers");
const feedbackNode = document.getElementById("feedback");
const panelNode = document.getElementById("questionPanel");
const victoryNode = document.getElementById("victory");
const starsNode = document.getElementById("stars");
const questionNode = document.getElementById("questionText");
const questionNumberNode = document.getElementById("questionNumber");
const progressNode = document.getElementById("progress");
let mission = [], currentQuestion = 0, starCount = 0, isLocked = false, gameEpoch = 0;
let reactionTimer = null, activeCleanup = null, completed = false;

function safePlay(video) {
  try { const promise = video.play(); if (promise && typeof promise.catch === "function") promise.catch(() => {}); } catch (_) {}
}
function pauseAndHide(video) {
  video.pause();
  video.classList.remove("active");
  try { video.currentTime = 0; } catch (_) {}
}
function showWelcome() {
  pauseAndHide(videoSuccess);
  pauseAndHide(videoOops);
  safePlay(videoWelcome);
}
function unlockInterface() {
  isLocked = false;
  answersNode.querySelectorAll("button").forEach(button => { button.disabled = false; });
}
function lockInterface() {
  isLocked = true;
  answersNode.querySelectorAll("button").forEach(button => { button.disabled = true; });
}
function clearReaction() {
  if (reactionTimer !== null) { clearTimeout(reactionTimer); reactionTimer = null; }
  if (activeCleanup) { const clean = activeCleanup; activeCleanup = null; clean(); }
}
function drawStars() {
  starsNode.querySelectorAll(".star").forEach((star, i) => star.classList.toggle("earned", i < starCount));
  starsNode.setAttribute("aria-label", "Собрано звёзд: " + starCount + " из " + TARGET_STARS);
  progressNode.querySelectorAll("span").forEach((segment, i) => segment.classList.toggle("done", i < starCount));
}
function drawQuestion() {
  if (completed || currentQuestion >= TARGET_STARS) return;
  // Очистка состояния происходит до создания кнопок, включая после правильного ответа.
  feedbackNode.textContent = "";
  feedbackNode.className = "feedback";
  const item = mission[currentQuestion];
  questionNumberNode.textContent = String(currentQuestion + 1).padStart(2,"0") + " / " + String(TARGET_STARS).padStart(2,"0");
  questionNode.textContent = item.question;
  answersNode.replaceChildren();
  item.answers.forEach((answer, answerIndex) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = String.fromCharCode(65 + answerIndex);
    const label = document.createElement("span");
    label.textContent = answer;
    button.append(letter,label);
    button.addEventListener("click", () => submitAnswer(answerIndex, button));
    answersNode.appendChild(button);
  });
  unlockInterface(); // КРИТИЧЕСКИ ВАЖНО: кнопки нового вопроса снова активны.
}
function selectMission() {
  const pool = questions.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, TARGET_STARS);
}
function finishGame() {
  completed = true;
  panelNode.hidden = true;
  victoryNode.hidden = false;
  unlockInterface();
}
function playReaction(video, callback) {
  clearReaction();
  const epoch = gameEpoch; // События предыдущих запусков не изменяют новую игру.
  let settled = false;
  let started = false;
  const other = video === videoSuccess ? videoOops : videoSuccess;
  pauseAndHide(other);
  video.pause();
  try { video.currentTime = 0; } catch (_) {}
  video.classList.add("active");
  const cleanup = () => {
    video.removeEventListener("ended", onEnded);
    video.removeEventListener("error", onError);
    video.removeEventListener("playing", onPlaying);
  };
  const finish = () => {
    if (settled || epoch !== gameEpoch) return;
    settled = true;
    clearReaction();
    showWelcome();
    callback();
  };
  const onEnded = () => finish();
  const onError = () => finish();
  const onPlaying = () => { started = true; };
  video.addEventListener("ended", onEnded);
  video.addEventListener("error", onError);
  video.addEventListener("playing", onPlaying);
  activeCleanup = cleanup;
  reactionTimer = setTimeout(finish, MAX_REACTION_MS);
  try {
    const promise = video.play();
    if (promise && typeof promise.catch === "function") {
      promise.catch(() => {
        if (epoch === gameEpoch && !started) finish();
      });
    }
  } catch (_) { finish(); }
}
function submitAnswer(index, button) {
  if (isLocked || completed || currentQuestion >= TARGET_STARS) return;
  lockInterface(); // Установка блокировки синхронно исключает двойной клик.
  const isCorrect = index === mission[currentQuestion].correctIndex;
  button.classList.add(isCorrect ? "correct" : "wrong");
  if (isCorrect) {
    feedbackNode.textContent = "Правильно! Отличная работа!";
    playReaction(videoSuccess, () => {
      if (completed) return;
      starCount = Math.min(starCount + 1, TARGET_STARS);
      drawStars();
      currentQuestion++;
      if (starCount === TARGET_STARS) finishGame();
      else drawQuestion(); // drawQuestion обязательно вызывает unlockInterface().
    });
  } else {
    feedbackNode.textContent = "Упс! Попробуй еще раз!";
    feedbackNode.classList.add("error");
    playReaction(videoOops, () => {
      // Неверная кнопка перестаёт быть красной, вопрос остаётся тем же.
      button.classList.remove("wrong");
      unlockInterface();
    });
  }
}
function resetGame() {
  gameEpoch++; // Инвалидирует устаревшие ended, error, Promise и setTimeout.
  clearReaction();
  showWelcome();
  currentQuestion = 0;
  starCount = 0;
  completed = false;
  mission = selectMission();
  panelNode.hidden = false;
  victoryNode.hidden = true;
  drawStars();
  drawQuestion();
  unlockInterface();
}
document.getElementById("restart").addEventListener("click", resetGame);
document.getElementById("again").addEventListener("click", resetGame);
videoWelcome.addEventListener("error", () => { /* Фон остаётся тёмным, викторина работает. */ });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !videoSuccess.classList.contains("active") && !videoOops.classList.contains("active")) safePlay(videoWelcome);
});
resetGame();
</script>
</body>
</html>
